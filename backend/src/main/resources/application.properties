quarkus.application.name=wallet-backend
quarkus.http.port=8080

# ---- Mock externo (BCP Wallet Mock) ----
mock.base-url=${MOCK_BASE_URL:https://bcp-wallet-mock.yefri.workers.dev/groups/1}
quarkus.rest-client.bcp-wallet-mock.url=${mock.base-url}
quarkus.rest-client.bcp-wallet-mock.connect-timeout=10000
quarkus.rest-client.bcp-wallet-mock.read-timeout=20000
quarkus.rest-client.bcp-wallet-mock.scope=jakarta.inject.Singleton

# ---- Reglas de negocio MVP ----
payments.low-value-limit-cents=50000
payments.resolve-retry-window-seconds=15

# ---- Base de datos local (journal) ----
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:wallet-journal;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ---- CORS ----
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,Idempotency-Key
quarkus.http.cors.exposed-headers=Idempotency-Key

# ---- Health ----
quarkus.smallrye-health.root-path=/q/health

# ---- Logging ----
quarkus.log.console.enable=true
quarkus.log.category."pe.bcp.wallet".level=INFO
